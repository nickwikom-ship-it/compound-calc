<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance Master Pro - nick.wl</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>body { font-family: 'Kanit', sans-serif; }</style>
</head>
<body class="bg-slate-50 min-h-screen p-4 md:p-8">
    <div class="max-w-6xl mx-auto bg-white rounded-3xl shadow-2xl overflow-hidden border border-gray-100">
        
        <div class="bg-slate-900 p-8 text-white text-center">
            <h1 class="text-2xl md:text-3xl font-bold mb-6" id="t-title">🚀 ระบบคำนวณการเงินและพอร์ตหุ้น</h1>
            <div class="flex flex-wrap items-center justify-center gap-2 text-xs">
                <div class="flex bg-slate-800 p-1.5 rounded-2xl border border-slate-700">
                    <button onclick="switchMode('compound')" id="nav-compound" class="py-2 px-4 rounded-xl font-semibold transition bg-indigo-600 text-white shadow-lg">ดอกเบี้ยทบต้น</button>
                    <button onclick="switchMode('trading')" id="nav-trading" class="py-2 px-4 rounded-xl font-semibold transition text-slate-400">จำลองการเทรด</button>
                    <button onclick="switchMode('dividend')" id="nav-dividend" class="py-2 px-4 rounded-xl font-semibold transition text-slate-400">หุ้นปันผล (DCA)</button>
                </div>
                <div class="flex bg-slate-800 p-1.5 rounded-2xl border border-slate-700 ml-2">
                    <button onclick="changeLang('th')" id="lang-th" class="py-2 px-4 rounded-xl font-bold transition bg-indigo-600 text-white">TH</button>
                    <button onclick="changeLang('en')" id="lang-en" class="py-2 px-4 rounded-xl font-bold transition text-slate-400">EN</button>
                </div>
            </div>
        </div>

        <div class="p-6 md:p-10">
            <div class="mb-8 grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="space-y-2">
                    <label class="font-semibold text-gray-600" id="t-cur-label">💰 สกุลเงินหลัก (Target)</label>
                    <select id="mainCurrency" class="w-full p-4 bg-gray-50 border-2 border-indigo-100 rounded-2xl outline-none focus:border-indigo-500">
                        <option value="THB">THB (฿)</option><option value="USD">USD ($)</option>
                    </select>
                </div>
                <div id="box-principal" class="space-y-2">
                    <label class="font-semibold text-gray-600" id="t-principal-label">💵 เงินต้นเริ่มต้น</label>
                    <input type="number" id="principal" value="10000" class="w-full p-4 bg-gray-50 border-2 border-gray-100 rounded-2xl">
                </div>
            </div>

            <div id="tab-compound" class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                <div class="space-y-2"><label class="font-semibold text-gray-600" id="t-cp-rate">📈 กำไร (%) ต่อรอบ</label><input type="number" id="cp-rate" value="5" class="w-full p-4 bg-gray-50 border-2 border-gray-100 rounded-2xl"></div>
                <div class="space-y-2"><label class="font-semibold text-gray-600" id="t-cp-dur">⏳ จำนวนรอบ</label><input type="number" id="cp-duration" value="12" class="w-full p-4 bg-gray-50 border-2 border-gray-100 rounded-2xl"></div>
            </div>

            <div id="tab-trading" class="hidden grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                <div class="space-y-2"><label class="font-semibold text-gray-600" id="t-tr-win">🎯 Win Rate (%)</label><input type="number" id="tr-win" value="60" class="w-full p-4 bg-gray-50 border-2 border-gray-100 rounded-2xl"></div>
                <div class="space-y-2"><label class="font-semibold text-gray-600" id="t-tr-tp">✅ TP (Points)</label><input type="number" id="tr-tp" value="500" class="w-full p-4 bg-green-50 border-2 border-green-100 rounded-2xl"></div>
                <div class="space-y-2"><label class="font-semibold text-gray-600" id="t-tr-sl">❌ SL (Points)</label><input type="number" id="tr-sl" value="250" class="w-full p-4 bg-red-50 border-2 border-red-100 rounded-2xl"></div>
            </div>

            <div id="tab-dividend" class="hidden grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mb-8">
                <div class="space-y-2"><label class="font-semibold text-gray-600" id="t-dv-shares">📜 หุ้นเริ่มต้น (Shares)</label><input type="number" id="dv-shares" value="1000" class="w-full p-4 bg-gray-50 border-2 border-gray-100 rounded-2xl"></div>
                <div class="space-y-2"><label class="font-semibold text-gray-600" id="t-dv-price">🏷️ ราคาหุ้นปัจจุบัน</label><input type="number" id="dv-price" value="50" class="w-full p-4 bg-gray-50 border-2 border-gray-100 rounded-2xl"></div>
                <div class="space-y-2"><label class="font-semibold text-gray-600" id="t-dv-val">💰 ปันผล (ระบุตามแบบ)</label><input type="number" id="dv-val" value="2.5" class="w-full p-4 bg-emerald-50 border-2 border-emerald-100 rounded-2xl"></div>
                <div class="space-y-2">
                    <label class="font-semibold text-gray-600" id="t-dv-type">⚙️ รูปแบบการกรอกปันผล</label>
                    <select id="dv-type" class="w-full p-4 bg-emerald-600 text-white rounded-2xl font-bold"><option value="annual">ต่อปี (Annual)</option><option value="period">ต่องวด (Per Period)</option></select>
                </div>
                <div class="space-y-2">
                    <label class="font-semibold text-gray-600" id="t-dv-freq">📅 ความถี่การปันผล</label>
                    <select id="dv-freq" class="w-full p-4 bg-gray-50 border-2 border-gray-100 rounded-2xl"><option value="12">12 เดือน (รายปี)</option><option value="6">6 เดือน (ครึ่งปี)</option><option value="3">3 เดือน (รายไตรมาส)</option><option value="1">1 เดือน (รายเดือน)</option></select>
                </div>
                <div class="space-y-2"><label class="font-semibold text-gray-600" id="t-dv-dca">💸 DCA ต่อเดือน</label><input type="number" id="dv-dca" value="5000" class="w-full p-4 bg-blue-50 border-2 border-blue-100 rounded-2xl"></div>
                <div class="space-y-2"><label class="font-semibold text-gray-600" id="t-dv-dur">⏳ จำนวนปีที่ถือ</label><input type="number" id="dv-duration" value="10" class="w-full p-4 border-2 border-indigo-200 rounded-2xl"></div>
            </div>

            <button onclick="calculate()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-5 rounded-2xl font-bold text-xl mb-8 shadow-lg transition-all active:scale-95" id="t-calc-btn">คำนวณผลลัพธ์</button>

            <div id="analysis-div" class="hidden grid grid-cols-1 md:grid-cols-2 gap-4 mb-8 text-center">
                <div class="bg-emerald-900 text-white p-6 rounded-2xl border-t-4 border-emerald-400">
                    <p class="text-xs uppercase text-emerald-300" id="t-ann-inc-lbl">ปันผลต่อปี (หลังภาษี)</p>
                    <h3 class="text-2xl font-bold"><span id="res-ann-inc">0</span> <span class="sign"></span></h3>
                </div>
                <div class="bg-blue-900 text-white p-6 rounded-2xl border-t-4 border-blue-400">
                    <p class="text-xs uppercase text-blue-300" id="t-mon-inc-lbl">เงินเดือนจากหุ้น</p>
                    <h3 class="text-2xl font-bold"><span id="res-mon-inc">0</span> <span class="sign"></span></h3>
                </div>
            </div>

            <div id="results" class="hidden">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-10 text-center">
                    <div class="bg-slate-50 p-6 rounded-2xl border"><p class="text-gray-500 text-xs uppercase" id="t-res-total-lbl">ยอดเงินรวมสุทธิ</p><h2 class="text-3xl font-bold"><span id="res-total">0</span> <span class="sign"></span></h2></div>
                    <div class="bg-slate-50 p-6 rounded-2xl border"><p class="text-gray-500 text-xs uppercase" id="t-res-profit-lbl">กำไรสะสม</p><h2 class="text-3xl font-bold text-emerald-600"><span id="res-profit">0</span> <span class="sign"></span></h2></div>
                </div>
                
                <div class="bg-white p-4 border rounded-3xl h-[350px] mb-8 shadow-sm">
                    <canvas id="mainChart"></canvas>
                </div>

                <div class="bg-white border rounded-2xl overflow-hidden shadow-sm">
                    <table class="w-full text-left text-sm">
                        <thead class="bg-gray-100 border-b text-[10px] font-bold text-gray-500 uppercase">
                            <tr>
                                <th class="p-4" id="th-period">รอบที่/ปี</th>
                                <th class="p-4 text-right" id="th-shares">จำนวนหุ้น/มูลค่า</th>
                                <th class="p-4 text-right" id="th-gain">กำไร/ปันผล</th>
                                <th class="p-4 text-right" id="th-balance">เงินรวมสุทธิ</th>
                            </tr>
                        </thead>
                        <tbody id="res-table" class="divide-y text-gray-700"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentMode = 'compound'; let chart = null; let lang = 'th';

        const dict = {
            th: {
                title: "🚀 ระบบคำนวณการเงินและพอร์ตหุ้น",
                navCp: "ดอกเบี้ยทบต้น", navTr: "จำลองการเทรด", navDv: "หุ้นปันผล (DCA)",
                cur: "💰 สกุลเงินหลัก (Target)", principal: "💵 เงินต้นเริ่มต้น",
                cpRate: "📈 กำไร (%) ต่อรอบ", cpDur: "⏳ จำนวนรอบ",
                trWin: "🎯 Win Rate (%)", trTp: "✅ TP (Points)", trSl: "❌ SL (Points)",
                dvShares: "📜 หุ้นเริ่มต้น (Shares)", dvPrice: "🏷️ ราคาหุ้นปัจจุบัน", dvVal: "💰 ปันผล (ระบุตามแบบ)",
                dvType: "⚙️ รูปแบบการกรอกปันผล", dvFreq: "📅 ความถี่การปันผล", dvDca: "💸 DCA ต่อเดือน", dvDur: "⏳ จำนวนปีที่ถือ",
                calc: "คำนวณผลลัพธ์", annInc: "ปันผลต่อปี (หลังภาษี)", monInc: "เงินเดือนจากหุ้น",
                resTot: "ยอดเงินรวมสุทธิ", resProf: "กำไรสะสม",
                hPer: "รอบที่/ปี", hSha: "จำนวนหุ้น/มูลค่า", hGai: "กำไร/ปันผล", hBal: "เงินรวมสุทธิ"
            },
            en: {
                title: "🚀 Finance & Portfolio Simulator",
                navCp: "Compound Interest", navTr: "Trading Sim", navDv: "Dividend Stock",
                cur: "💰 Main Currency", principal: "💵 Initial Capital",
                cpRate: "📈 Profit (%)", cpDur: "⏳ Total Rounds",
                trWin: "🎯 Win Rate (%)", trTp: "✅ TP (Points)", trSl: "❌ SL (Points)",
                dvShares: "📜 Initial Shares", dvPrice: "🏷️ Stock Price", dvVal: "💰 Dividend Value",
                dvType: "⚙️ Dividend Input Mode", dvFreq: "📅 Div Frequency", dvDca: "💸 Monthly DCA", dvDur: "⏳ Years to Hold",
                calc: "Calculate Result", annInc: "Annual Div (Net)", monInc: "Monthly Dividend",
                resTot: "Total Balance", resProf: "Accumulated Profit",
                hPer: "Period/Year", hSha: "Shares/Value", hGai: "Gain/Dividend", hBal: "Net Balance"
            }
        };

        function changeLang(l) {
            lang = l; const t = dict[l];
            document.getElementById('t-title').innerText = t.title;
            document.getElementById('nav-compound').innerText = t.navCp;
            document.getElementById('nav-trading').innerText = t.navTr;
            document.getElementById('nav-dividend').innerText = t.navDv;
            document.getElementById('t-cur-label').innerText = t.cur;
            document.getElementById('t-principal-label').innerText = t.principal;
            document.getElementById('t-cp-rate').innerText = t.cpRate;
            document.getElementById('t-cp-dur').innerText = t.cpDur;
            document.getElementById('t-tr-win').innerText = t.trWin;
            document.getElementById('t-tr-tp').innerText = t.trTp;
            document.getElementById('t-tr-sl').innerText = t.trSl;
            document.getElementById('t-dv-shares').innerText = t.dvShares;
            document.getElementById('t-dv-price').innerText = t.dvPrice;
            document.getElementById('t-dv-val').innerText = t.dvVal;
            document.getElementById('t-dv-type').innerText = t.dvType;
            document.getElementById('t-dv-freq').innerText = t.dvFreq;
            document.getElementById('t-dv-dca').innerText = t.dvDca;
            document.getElementById('t-dv-dur').innerText = t.dvDur;
            document.getElementById('t-calc-btn').innerText = t.calc;
            document.getElementById('t-ann-inc-lbl').innerText = t.annInc;
            document.getElementById('t-mon-inc-lbl').innerText = t.monInc;
            document.getElementById('t-res-total-lbl').innerText = t.resTot;
            document.getElementById('t-res-profit-lbl').innerText = t.resProf;
            // หัวตาราง
            document.getElementById('th-period').innerText = t.hPer;
            document.getElementById('th-shares').innerText = t.hSha;
            document.getElementById('th-gain').innerText = t.hGai;
            document.getElementById('th-balance').innerText = t.hBal;

            document.getElementById('lang-th').className = l === 'th' ? 'py-2 px-4 rounded-xl font-bold bg-indigo-600 text-white' : 'py-2 px-4 rounded-xl font-bold text-slate-400';
            document.getElementById('lang-en').className = l === 'en' ? 'py-2 px-4 rounded-xl font-bold bg-indigo-600 text-white' : 'py-2 px-4 rounded-xl font-bold text-slate-400';
        }

        function switchMode(m) {
            currentMode = m;
            document.getElementById('tab-compound').classList.toggle('hidden', m !== 'compound');
            document.getElementById('tab-trading').classList.toggle('hidden', m !== 'trading');
            document.getElementById('tab-dividend').classList.toggle('hidden', m !== 'dividend');
            document.getElementById('box-principal').classList.toggle('hidden', m === 'dividend');
            document.getElementById('analysis-div').classList.add('hidden');
            
            ['nav-compound', 'nav-trading', 'nav-dividend'].forEach(id => {
                document.getElementById(id).className = id.includes(m) ? "py-2 px-4 rounded-xl font-semibold bg-indigo-600 text-white shadow-lg" : "py-2 px-4 rounded-xl font-semibold text-slate-400 hover:text-white";
            });
        }

        function calculate() {
            const mainCur = document.getElementById('mainCurrency').value;
            document.querySelectorAll('.sign').forEach(el => el.innerText = mainCur);
            document.getElementById('results').classList.remove('hidden');
            const table = document.getElementById('res-table'); table.innerHTML = '';
            
            let labels = ['0'], dataPoints = [], totalBal = 0, profit = 0;

            if (currentMode === 'compound') {
                let p = parseFloat(document.getElementById('principal').value), r = parseFloat(document.getElementById('cp-rate').value)/100, d = parseInt(document.getElementById('cp-duration').value);
                totalBal = p; dataPoints.push(p);
                for(let i=1; i<=d; i++) {
                    let g = totalBal * r; totalBal += g;
                    labels.push(i); dataPoints.push(totalBal.toFixed(2));
                    table.innerHTML += `<tr><td class="p-4">Round ${i}</td><td class="p-4 text-right">${(totalBal-g).toLocaleString()}</td><td class="p-4 text-right text-green-600">+${g.toLocaleString()}</td><td class="p-4 text-right font-bold">${totalBal.toLocaleString()}</td></tr>`;
                }
                profit = totalBal - p;
            } 
            else if (currentMode === 'dividend') {
                document.getElementById('analysis-div').classList.remove('hidden');
                let s = parseFloat(document.getElementById('dv-shares').value), pStk = parseFloat(document.getElementById('dv-price').value), dVal = parseFloat(document.getElementById('dv-val').value), dca = parseFloat(document.getElementById('dv-dca').value), dur = parseInt(document.getElementById('dv-duration').value), freq = parseInt(document.getElementById('dv-freq').value), type = document.getElementById('dv-type').value;
                
                let annDivPerShare = (type === 'annual') ? dVal : dVal * (12/freq);
                let perDiv = annDivPerShare / (12/freq);
                let invested = s * pStk;
                dataPoints.push(invested);

                for(let y=1; y<=dur; y++) {
                    let yDiv = 0;
                    for(let m=1; m<=12; m++) {
                        s += dca/pStk; invested += dca;
                        if(m%freq===0) {
                            let paid = (s * perDiv) * 0.9; // Tax 10%
                            yDiv += paid; s += paid/pStk;
                        }
                    }
                    totalBal = s * pStk; labels.push('Y'+y); dataPoints.push(totalBal.toFixed(2));
                    table.innerHTML += `<tr><td class="p-4 font-bold">Year ${y}</td><td class="p-4 text-right">${s.toLocaleString(undefined,{maximumFractionDigits:0})} Shares</td><td class="p-4 text-right text-emerald-600">+${yDiv.toLocaleString()}</td><td class="p-4 text-right font-bold">${totalBal.toLocaleString()}</td></tr>`;
                }
                profit = totalBal - invested;
                let annInc = (s * annDivPerShare) * 0.9;
                document.getElementById('res-ann-inc').innerText = annInc.toLocaleString(undefined,{maximumFractionDigits:2});
                document.getElementById('res-mon-inc').innerText = (annInc/12).toLocaleString(undefined,{maximumFractionDigits:2});
            } else {
                // Trading Mode (Quick Sim)
                let p = parseFloat(document.getElementById('principal').value); totalBal = p; dataPoints.push(p);
                for(let i=1; i<=10; i++) { 
                    let g = p * (Math.random() > 0.4 ? 0.1 : -0.05); totalBal += g; labels.push(i); dataPoints.push(totalBal.toFixed(2));
                    table.innerHTML += `<tr><td class="p-4">Trade ${i}</td><td class="p-4 text-right">${(totalBal-g).toLocaleString()}</td><td class="p-4 text-right ${g>0?'text-green-600':'text-red-600'}">${g.toLocaleString()}</td><td class="p-4 text-right font-bold">${totalBal.toLocaleString()}</td></tr>`;
                }
                profit = totalBal - p;
            }

            document.getElementById('res-total').innerText = totalBal.toLocaleString();
            document.getElementById('res-profit').innerText = profit.toLocaleString();
            if(chart) chart.destroy();
            chart = new Chart(document.getElementById('mainChart'), { type: 'line', data: { labels, datasets: [{ data: dataPoints, borderColor: '#4f46e5', tension: 0.3, fill: true, backgroundColor: 'rgba(79, 70, 229, 0.05)' }] }, options: { responsive: true, maintainAspectRatio: false } });
        }
    </script>
</body>
</html>
