<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance Simulator - nick.wl Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>body { font-family: 'Kanit', sans-serif; }</style>
</head>
<body class="bg-slate-50 min-h-screen p-4 md:p-8">
    <div class="max-w-6xl mx-auto bg-white rounded-3xl shadow-2xl overflow-hidden border border-gray-100">
        
        <div class="bg-slate-900 p-8 text-white text-center">
            <h1 class="text-2xl md:text-3xl font-bold mb-6" id="t-title">🚀 เครื่องมือคำนวณการเงิน (Multi-Currency)</h1>
            <div class="flex flex-wrap items-center justify-center gap-4 text-xs">
                <div class="flex bg-slate-800 p-1.5 rounded-2xl border border-slate-700 overflow-x-auto">
                    <button onclick="switchMode('compound')" id="btn-compound" class="whitespace-nowrap py-2 px-4 rounded-xl font-semibold transition bg-indigo-600 text-white shadow-lg">ดอกเบี้ยทบต้น</button>
                    <button onclick="switchMode('trading')" id="btn-trading" class="whitespace-nowrap py-2 px-4 rounded-xl font-semibold transition text-slate-400 hover:text-white">จำลองการเทรด</button>
                    <button onclick="switchMode('dividend')" id="btn-dividend" class="whitespace-nowrap py-2 px-4 rounded-xl font-semibold transition text-slate-400 hover:text-white">หุ้นปันผล</button>
                </div>
            </div>
        </div>

        <div class="p-6 md:p-10">
            <div id="common-inputs" class="mb-8">
                <div class="space-y-2 max-w-xs">
                    <label class="font-semibold text-gray-600">💰 สกุลเงินหลักที่ต้องการสรุปผล (Target)</label>
                    <select id="mainCurrency" class="w-full p-4 bg-gray-50 border-2 border-indigo-200 rounded-2xl outline-none">
                        <option value="THB">THB (฿)</option>
                        <option value="USD">USD ($)</option>
                        <option value="EUR">EUR (€)</option>
                    </select>
                </div>
            </div>

            <div id="input-dividend" class="hidden grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mb-8">
                <div class="space-y-2"><label class="font-semibold text-gray-600">📜 จำนวนหุ้นเริ่มต้น</label><input type="number" id="shares" value="1000" class="w-full p-4 bg-gray-50 border-2 border-gray-100 rounded-2xl"></div>
                
                <div class="space-y-2">
                    <label class="font-semibold text-gray-600">🏷️ ราคาหุ้นปัจจุบัน</label>
                    <div class="flex">
                        <input type="number" id="stockPrice" value="50" class="w-full p-4 bg-gray-50 border-2 border-gray-100 border-r-0 rounded-l-2xl outline-none">
                        <select id="priceCur" class="p-4 bg-gray-100 border-2 border-gray-100 rounded-r-2xl outline-none font-bold">
                            <option value="THB">THB</option><option value="USD">USD</option><option value="EUR">EUR</option>
                        </select>
                    </div>
                </div>

                <div class="space-y-2">
                    <label class="font-semibold text-gray-600">💰 ปันผลต่อหุ้น</label>
                    <div class="flex">
                        <input type="number" id="divPerShare" value="2.5" class="w-full p-4 bg-emerald-50 border-2 border-emerald-100 border-r-0 rounded-l-2xl outline-none">
                        <select id="divCur" class="p-4 bg-emerald-100 border-2 border-emerald-100 rounded-r-2xl outline-none font-bold">
                            <option value="THB">THB</option><option value="USD">USD</option><option value="EUR">EUR</option>
                        </select>
                    </div>
                </div>

                <div class="space-y-2">
                    <label class="font-semibold text-gray-600">💸 ซื้อเพิ่มต่อเดือน (DCA)</label>
                    <div class="flex">
                        <input type="number" id="monthlyBuy" value="5000" class="w-full p-4 bg-blue-50 border-2 border-blue-100 border-r-0 rounded-l-2xl outline-none">
                        <select id="dcaCur" class="p-4 bg-blue-100 border-2 border-blue-100 rounded-r-2xl outline-none font-bold">
                            <option value="THB">THB</option><option value="USD">USD</option><option value="EUR">EUR</option>
                        </select>
                    </div>
                </div>

                <div class="space-y-2"><label class="font-semibold text-gray-600">🧾 ภาษีปันผล (%)</label><input type="number" id="divTax" value="10" class="w-full p-4 bg-gray-50 border-2 border-gray-100 rounded-2xl"></div>
                <div class="space-y-2"><label class="font-semibold text-gray-600">⏳ จำนวนปีที่ถือ</label><input type="number" id="divYears" value="10" class="w-full p-4 bg-gray-50 border-2 border-gray-100 rounded-2xl"></div>
                
                <div class="space-y-2 lg:col-span-3">
                    <label class="font-semibold text-gray-600">🔄 รูปแบบปันผล</label>
                    <select id="divReinvest" class="w-full p-4 bg-indigo-50 border-2 border-indigo-100 rounded-2xl font-bold text-indigo-700">
                        <option value="cash">รับปันผลเป็นเงินสด (Cash Out)</option>
                        <option value="reinvest">นำปันผลไปลงทุนเพิ่ม (Reinvest)</option>
                    </select>
                </div>
            </div>

            <button id="calcBtn" onclick="processDividend()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-5 rounded-2xl font-bold text-xl mb-4 shadow-lg transition-all flex items-center justify-center gap-3">
                <span>คำนวณผลลัพธ์</span>
            </button>
            <p id="exchangeRemark" class="text-center text-xs text-gray-400 italic mb-8"></p>

            <div id="results" class="hidden">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-10 text-center">
                    <div class="bg-indigo-50 p-8 rounded-3xl border border-indigo-100">
                        <p class="text-indigo-600 text-xs font-bold uppercase mb-2">มูลค่าพอร์ตสุทธิ</p>
                        <h2 class="text-3xl font-bold text-indigo-900"><span id="resTotal">0</span> <span class="mainSign"></span></h2>
                    </div>
                    <div class="bg-emerald-50 p-8 rounded-3xl border border-emerald-100">
                        <p class="text-emerald-600 text-xs font-bold uppercase mb-2">กำไรทั้งหมด (รวมปันผล)</p>
                        <h2 class="text-3xl font-bold text-emerald-700"><span id="resProfit">0</span> <span class="mainSign"></span></h2>
                    </div>
                </div>
                <div class="bg-white p-6 border rounded-3xl h-[350px] mb-8 shadow-sm"><canvas id="mainChart"></canvas></div>
            </div>

            <div class="bg-indigo-50 p-8 rounded-3xl border border-indigo-100 text-center mt-10">
                <h3 class="font-bold text-indigo-900 text-xl mb-1">👨‍💻 จัดทำโดย</h3>
                <p class="text-indigo-700 font-bold text-2xl tracking-wide">nick.wl</p>
            </div>
        </div>
    </div>

    <script>
        let chart = null;

        function switchMode(mode) {
            document.getElementById('input-dividend').classList.toggle('hidden', mode !== 'dividend');
            // Simplified for this demo focusing on your request
        }
        switchMode('dividend'); // Default to dividend

        // ดึงข้อมูลอัตราแลกเปลี่ยนจริง
        async function getExchangeRates(base) {
            try {
                const res = await fetch(`https://open.er-api.com/v6/latest/${base}`);
                const data = await res.json();
                return data.rates;
            } catch (e) {
                alert("ไม่สามารถดึงข้อมูลค่าเงินปัจจุบันได้ ระบบจะใช้ค่าคงที่โดยประมาณ");
                return { "THB": 1, "USD": 0.028, "EUR": 0.026 };
            }
        }

        async function processDividend() {
            const btn = document.getElementById('calcBtn');
            btn.innerText = "กำลังดึงข้อมูลค่าเงิน...";
            btn.disabled = true;

            const targetCur = document.getElementById('mainCurrency').value;
            const rates = await getExchangeRates(targetCur);
            
            // Helper to convert to target currency
            const toTarget = (val, fromCur) => val / rates[fromCur];

            const sStart = parseFloat(document.getElementById('shares').value);
            const pStock = parseFloat(document.getElementById('stockPrice').value);
            const pCur = document.getElementById('priceCur').value;
            
            const dShare = parseFloat(document.getElementById('divPerShare').value);
            const dCur = document.getElementById('divCur').value;
            
            const mBuy = parseFloat(document.getElementById('monthlyBuy').value);
            const mCur = document.getElementById('dcaCur').value;
            
            const tax = parseFloat(document.getElementById('divTax').value)/100;
            const years = parseInt(document.getElementById('divYears').value);
            const mode = document.getElementById('divReinvest').value;

            // Normalize all values to Target Currency for calculation
            const stockPriceInTarget = toTarget(pStock, pCur);
            const divInTarget = toTarget(dShare, dCur);
            const dcaInTarget = toTarget(mBuy, mCur);
            
            let currentShares = sStart;
            let totalInvestedInTarget = toTarget(sStart * pStock, pCur);
            let accCashInTarget = 0;
            let dataPoints = [];
            let labels = ['เริ่ม'];

            for(let y=1; y<=years; y++) {
                // DCA
                let yearlyDCA = dcaInTarget * 12;
                currentShares += yearlyDCA / stockPriceInTarget;
                totalInvestedInTarget += yearlyDCA;

                // Dividend
                let yearlyDiv = (currentShares * divInTarget) * (1 - tax);
                
                if(mode === 'reinvest') {
                    currentShares += yearlyDiv / stockPriceInTarget;
                } else {
                    accCashInTarget += yearlyDiv;
                }
                
                let currentVal = (currentShares * stockPriceInTarget) + (mode === 'cash' ? accCashInTarget : 0);
                dataPoints.push(currentVal.toFixed(2));
                labels.push('ปีที่ '+y);
            }

            const finalBalance = (currentShares * stockPriceInTarget) + accCashInTarget;
            const finalProfit = finalBalance - totalInvestedInTarget;

            // UI Update
            document.getElementById('results').classList.remove('hidden');
            document.querySelectorAll('.mainSign').forEach(el => el.innerText = targetCur);
            document.getElementById('resTotal').innerText = finalBalance.toLocaleString(undefined, {minimumFractionDigits: 2});
            document.getElementById('resProfit').innerText = finalProfit.toLocaleString(undefined, {minimumFractionDigits: 2});
            
            // Remark Update
            document.getElementById('exchangeRemark').innerText = 
                `Remark: คำนวณโดยอิงอัตราแลกเปลี่ยนปัจจุบัน (1 ${targetCur} = ${rates['THB'].toFixed(2)} THB | ${rates['USD'].toFixed(4)} USD | ${rates['EUR'].toFixed(4)} EUR)`;

            updateChart(labels, dataPoints, targetCur);
            btn.innerText = "คำนวณผลลัพธ์";
            btn.disabled = false;
        }

        function updateChart(labels, data, symbol) {
            const ctx = document.getElementById('mainChart').getContext('2d');
            if(chart) chart.destroy();
            chart = new Chart(ctx, {
                type: 'line',
                data: { labels, datasets: [{ data, borderColor: '#4f46e5', tension: 0.3, fill: true, backgroundColor: 'rgba(79, 70, 229, 0.05)' }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
            });
        }
    </script>
</body>
</html>
