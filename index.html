<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance & Trading Simulator Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; transition: all 0.3s ease; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen p-4 md:p-8">
    <div class="max-w-6xl mx-auto bg-white rounded-3xl shadow-2xl overflow-hidden border border-gray-100">
        
        <div class="bg-slate-900 p-8 text-white text-center">
            <h1 class="text-2xl md:text-3xl font-bold mb-6" id="t-title">🚀 เครื่องมือคำนวณการเงินและการเทรด</h1>
            <div class="flex flex-col md:flex-row items-center justify-center gap-4 text-sm">
                <div class="flex bg-slate-800 p-1.5 rounded-2xl w-full md:w-80 border border-slate-700">
                    <button onclick="switchMode('compound')" id="btn-compound" class="flex-1 py-2 px-4 rounded-xl font-semibold transition bg-indigo-600 text-white shadow-lg">
                        <span id="t-mode-c">ดอกเบี้ยทบต้น</span>
                    </button>
                    <button onclick="switchMode('trading')" id="btn-trading" class="flex-1 py-2 px-4 rounded-xl font-semibold transition text-slate-400 hover:text-white">
                        <span id="t-mode-t">จำลองการเทรด</span>
                    </button>
                </div>
                <div class="flex bg-slate-800 p-1.5 rounded-2xl border border-slate-700">
                    <button onclick="changeLang('th')" id="lang-th" class="py-2 px-6 rounded-xl font-bold transition bg-indigo-600 text-white shadow-lg">TH</button>
                    <button onclick="changeLang('en')" id="lang-en" class="py-2 px-6 rounded-xl font-bold transition text-slate-400 hover:text-white">EN</button>
                </div>
            </div>
        </div>

        <div class="p-6 md:p-10">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                <div class="space-y-2">
                    <label class="font-semibold text-gray-600" id="t-currency">💰 สกุลเงิน</label>
                    <select id="currency" class="w-full p-4 bg-gray-50 border-2 border-gray-100 rounded-2xl outline-none focus:border-indigo-500 transition-all">
                        <option value="฿">THB (฿)</option>
                        <option value="$">USD ($)</option>
                    </select>
                </div>
                <div class="space-y-2">
                    <label class="font-semibold text-gray-600" id="t-principal">💵 เงินต้นเริ่มต้น</label>
                    <input type="number" id="principal" value="10000" class="w-full p-4 bg-gray-50 border-2 border-gray-100 rounded-2xl outline-none focus:border-indigo-500 transition-all">
                </div>
            </div>

            <div id="input-compound" class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                <div class="space-y-2">
                    <label class="font-semibold text-gray-600" id="t-rate">📈 กำไร (%) ต่อรอบ</label>
                    <div class="flex">
                        <input type="number" id="rate" value="5" class="w-full p-4 bg-gray-50 border-2 border-gray-100 border-r-0 rounded-l-2xl outline-none">
                        <select id="ratePeriod" class="p-4 bg-indigo-50 border-2 border-indigo-100 rounded-r-2xl outline-none text-indigo-700 font-bold">
                            <option value="วัน">ต่อวัน</option>
                            <option value="ปี" selected>ต่อปี</option>
                        </select>
                    </div>
                </div>
                <div class="space-y-2">
                    <label class="font-semibold text-gray-600" id="t-duration">⏳ จำนวนรอบทั้งหมด</label>
                    <input type="number" id="duration" value="12" class="w-full p-4 bg-gray-50 border-2 border-gray-100 rounded-2xl outline-none">
                </div>
            </div>

            <div id="input-trading" class="hidden grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                <div class="space-y-2"><label class="font-semibold text-gray-600" id="t-winrate">🎯 Win Rate (%)</label><input type="number" id="winRate" value="60" class="w-full p-4 bg-gray-50 border-2 border-gray-100 rounded-2xl"></div>
                <div class="space-y-2"><label class="font-semibold text-gray-600" id="t-tp">✅ Take Profit (Pts)</label><input type="number" id="tpPoints" value="500" class="w-full p-4 bg-green-50 border-2 border-green-100 rounded-2xl"></div>
                <div class="space-y-2"><label class="font-semibold text-gray-600" id="t-sl">❌ Stop Loss (Pts)</label><input type="number" id="slPoints" value="250" class="w-full p-4 bg-red-50 border-2 border-red-100 rounded-2xl"></div>
                <div class="space-y-2"><label class="font-semibold text-gray-600" id="t-lottype">⚙️ คำนวณ Lot</label><select id="lotType" onchange="toggleLotInput()" class="w-full p-4 bg-indigo-50 border-2 border-indigo-100 rounded-2xl font-bold text-indigo-700"><option value="fixed">Fixed Lot</option><option value="percent">Risk %</option></select></div>
                <div class="space-y-2"><label id="lotLabel" class="font-semibold text-gray-600">📦 Lot</label><input type="number" id="lotValue" value="0.1" class="w-full p-4 bg-gray-50 border-2 border-gray-100 rounded-2xl"></div>
                <div class="space-y-2"><label class="font-semibold text-gray-600" id="t-trades">🔄 รอบเทรด</label><input type="number" id="totalTrades" value="20" class="w-full p-4 bg-gray-50 border-2 border-gray-100 rounded-2xl"></div>
            </div>

            <button onclick="processCalculation()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-5 rounded-2xl font-bold text-xl mb-12 shadow-lg active:scale-95 transition-all">
                <span id="t-btn-calc">คำนวณผลลัพธ์</span>
            </button>

            <div id="results" class="hidden">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-10 text-center">
                    <div class="bg-indigo-50 p-8 rounded-3xl border border-indigo-100 shadow-inner">
                        <p class="text-indigo-600 text-xs font-bold uppercase mb-2" id="t-res-total">Balance สุทธิ</p>
                        <h2 class="text-4xl font-bold text-indigo-900"><span class="curSign"></span> <span id="resTotal">0</span></h2>
                    </div>
                    <div class="bg-emerald-50 p-8 rounded-3xl border border-emerald-100 shadow-inner">
                        <p class="text-emerald-600 text-xs font-bold uppercase mb-2" id="t-res-profit">กำไรทั้งหมด</p>
                        <h2 class="text-4xl font-bold text-emerald-700"><span class="curSign"></span> <span id="resProfit">0</span></h2>
                    </div>
                </div>
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-12">
                    <div class="bg-white p-6 border rounded-3xl h-[400px] shadow-sm"><canvas id="mainChart"></canvas></div>
                    <div class="bg-white border rounded-3xl overflow-hidden flex flex-col shadow-sm">
                        <div id="tableHeaderLabel" class="font-bold p-5 border-b bg-gray-50">รายละเอียด</div>
                        <div class="overflow-y-auto max-h-[320px]">
                            <table class="w-full text-left text-sm"><thead class="bg-white sticky top-0 shadow-sm text-[10px] font-bold text-gray-400 uppercase"><tr><th class="p-4" id="t-col-id">#</th><th class="p-4 text-right" id="t-col-start">Start</th><th id="colStatus" class="p-4 hidden text-center">Status</th><th class="p-4 text-right" id="t-col-gain">Gain</th><th class="p-4 text-right" id="t-col-end">Balance</th></tr></thead><tbody id="resTable" class="divide-y"></tbody></table>
                        </div>
                    </div>
                </div>
            </div>

            <hr class="border-gray-100 mb-10">

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                <div class="bg-indigo-50 p-8 rounded-3xl border border-indigo-100 flex flex-col items-center justify-center text-center">
                    <h3 class="font-bold text-indigo-900 text-xl mb-1" id="t-created-title">👨‍💻 จัดทำโดย</h3>
                    <p class="text-indigo-700 font-semibold text-lg">[ใส่ชื่อของคุณที่นี่]</p>
                    <p class="text-indigo-500 text-sm mt-1 opacity-80" id="t-created-desc">มุ่งมั่นสร้างเครื่องมือที่มีคุณภาพ</p>
                </div>

                <div class="bg-slate-50 p-8 rounded-3xl border-2 border-dashed border-gray-200 flex flex-col justify-center">
                    <h3 class="text-lg font-bold text-slate-800 mb-2" id="t-req-title">💡 อยากได้อะไรเพิ่ม?</h3>
                    <div class="flex gap-2">
                        <input type="text" id="requestInput" placeholder="เพิ่มปุ่ม..." class="w-full p-4 border-2 border-white rounded-2xl outline-none focus:border-indigo-500 shadow-sm text-sm">
                        <button onclick="sendRequest()" class="bg-slate-800 hover:bg-black text-white px-6 py-4 rounded-2xl font-bold transition-all text-sm">
                            <span id="t-req-btn">ส่ง</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="bg-slate-50 p-6 text-center text-gray-400 text-xs border-t border-gray-100">
            © 2026 Compound & Trading Simulator | All Rights Reserved
        </div>
    </div>

    <script>
        let currentMode = 'compound'; let chart = null; let currentLang = 'th';
        const i18n = {
            th: {
                title: "🚀 เครื่องมือคำนวณการเงินและการเทรด", modeC: "ดอกเบี้ยทบต้น", modeT: "จำลองการเทรด",
                currency: "💰 สกุลเงิน", principal: "💵 เงินต้น", rate: "📈 กำไร (%) ต่อรอบ", duration: "⏳ จำนวนรอบ",
                winrate: "🎯 Win Rate (%)", tp: "✅ TP (Pts)", sl: "❌ SL (Pts)", lottype: "⚙️ คำนวณ Lot", trades: "🔄 ไม้เทรด",
                btnCalc: "คำนวณผลลัพธ์", resTotal: "Balance สุทธิ", resProfit: "กำไรทั้งหมด",
                tableHeader: "รายละเอียดรายงวด", colId: "ลำดับ", colStart: "เริ่ม", colGain: "กำไร/ขาดทุน", colEnd: "ยอดรวม",
                createdTitle: "👨‍💻 จัดทำโดย", createdDesc: "มุ่งมั่นสร้างเครื่องมือที่มีคุณภาพ",
                reqTitle: "💡 อยากได้อะไรเพิ่ม?", reqBtn: "ส่ง", reqAlert: "กรุณาพิมพ์สิ่งที่ต้องการก่อนส่งครับ"
            },
            en: {
                title: "🚀 Finance & Trading Simulator", modeC: "Compound", modeT: "Trading",
                currency: "💰 Currency", principal: "💵 Capital", rate: "📈 Profit (%)", duration: "⏳ Rounds",
                winrate: "🎯 Win Rate (%)", tp: "✅ TP (Pts)", sl: "❌ SL (Pts)", lottype: "⚙️ Lot Calc", trades: "🔄 Trades",
                btnCalc: "Calculate", resTotal: "Final Balance", resProfit: "Net Profit",
                tableHeader: "Detail Report", colId: "No.", colStart: "Start", colGain: "Gain/Loss", colEnd: "Balance",
                createdTitle: "👨‍💻 Created By", createdDesc: "Striving for quality tools",
                reqTitle: "💡 Any suggestions?", reqBtn: "Send", reqAlert: "Please type your suggestion first."
            }
        };

        function changeLang(lang) {
            currentLang = lang; const content = i18n[lang];
            document.getElementById('t-title').innerText = content.title;
            document.getElementById('t-mode-c').innerText = content.modeC;
            document.getElementById('t-mode-t').innerText = content.modeT;
            document.getElementById('t-btn-calc').innerText = content.btnCalc;
            document.getElementById('t-created-title').innerText = content.createdTitle;
            document.getElementById('t-created-desc').innerText = content.createdDesc;
            document.getElementById('t-req-title').innerText = content.reqTitle;
            document.getElementById('t-req-btn').innerText = content.reqBtn;
            document.getElementById('lang-th').className = lang === 'th' ? 'py-2 px-6 rounded-xl font-bold transition bg-indigo-600 text-white shadow-lg' : 'py-2 px-6 rounded-xl font-bold transition text-slate-400 hover:text-white';
            document.getElementById('lang-en').className = lang === 'en' ? 'py-2 px-6 rounded-xl font-bold transition bg-indigo-600 text-white shadow-lg' : 'py-2 px-6 rounded-xl font-bold transition text-slate-400 hover:text-white';
        }

        function switchMode(mode) {
            currentMode = mode;
            document.getElementById('input-compound').classList.toggle('hidden', mode !== 'compound');
            document.getElementById('input-trading').classList.toggle('hidden', mode !== 'trading');
            document.getElementById('btn-compound').className = mode === 'compound' ? "flex-1 py-2 px-4 rounded-xl font-semibold bg-indigo-600 text-white shadow-lg" : "flex-1 py-2 px-4 rounded-xl font-semibold text-slate-400 hover:text-white";
            document.getElementById('btn-trading').className = mode === 'trading' ? "flex-1 py-2 px-4 rounded-xl font-semibold bg-indigo-600 text-white shadow-lg" : "flex-1 py-2 px-4 rounded-xl font-semibold text-slate-400 hover:text-white";
        }

        function toggleLotInput() {
            const type = document.getElementById('lotType').value;
            document.getElementById('lotLabel').innerText = (type === 'fixed') ? "📦 Lot Size" : "⚠️ Risk %";
        }

        function sendRequest() {
            const req = document.getElementById('requestInput').value;
            if(!req) return alert(i18n[currentLang].reqAlert);
            window.location.href = `mailto:YOUR_EMAIL@example.com?subject=FeatureRequest&body=${req}`;
        }

        function processCalculation() {
            const principal = parseFloat(document.getElementById('principal').value);
            const symbol = document.getElementById('currency').value;
            if(!principal) return;
            document.getElementById('results').classList.remove('hidden');
            let currentBalance = principal; let labels = ['0']; let dataPoints = [principal];
            const tableBody = document.getElementById('resTable'); tableBody.innerHTML = '';
            
            if (currentMode === 'compound') {
                const rate = parseFloat(document.getElementById('rate').value)/100;
                const dur = parseInt(document.getElementById('duration').value);
                document.getElementById('colStatus').classList.add('hidden');
                for(let i=1; i<=dur; i++) {
                    let start = currentBalance; let profit = currentBalance * rate; currentBalance += profit;
                    tableBody.innerHTML += `<tr><td class="p-4 text-gray-400">${i}</td><td class="p-4 text-right">${start.toLocaleString(undefined,{minimumFractionDigits:2})}</td><td class="p-4 text-right text-green-600 font-bold">+${profit.toLocaleString(undefined,{minimumFractionDigits:2})}</td><td class="p-4 text-right font-bold text-slate-800">${currentBalance.toLocaleString(undefined,{minimumFractionDigits:2})}</td></tr>`;
                    labels.push(i); dataPoints.push(currentBalance.toFixed(2));
                }
            } else {
                const winR = parseFloat(document.getElementById('winRate').value)/100;
                const tp = parseFloat(document.getElementById('tpPoints').value);
                const sl = parseFloat(document.getElementById('slPoints').value);
                const lotType = document.getElementById('lotType').value;
                const lotVal = parseFloat(document.getElementById('lotValue').value);
                const trades = parseInt(document.getElementById('totalTrades').value);
                document.getElementById('colStatus').classList.remove('hidden');
                for(let i=1; i<=trades; i++) {
                    let start = currentBalance;
                    let calculatedLot = (lotType === 'fixed') ? lotVal : (currentBalance * (lotVal/100)) / sl;
                    const win = Math.random() < winR;
                    const change = win ? (tp * calculatedLot) : -(sl * calculatedLot);
                    currentBalance += change;
                    const statusTxt = win ? (currentLang === 'th' ? 'ชนะ' : 'WIN') : (currentLang === 'th' ? 'แพ้' : 'LOSS');
                    tableBody.innerHTML += `<tr><td class="p-4 text-gray-400">${i}</td><td class="p-4 text-right text-gray-600">${start.toLocaleString(undefined,{minimumFractionDigits:2})}</td><td class="p-4 text-center"><span class="px-2 py-0.5 rounded-full text-[10px] font-bold ${win?'bg-green-100 text-green-700':'bg-red-100 text-red-700'}">${statusTxt}</span></td><td class="p-4 text-right font-bold ${change>0?'text-green-600':'text-red-600'}">${change.toLocaleString(undefined,{minimumFractionDigits:2})}</td><td class="p-4 text-right font-bold text-slate-800">${currentBalance.toLocaleString(undefined,{minimumFractionDigits:2})}</td></tr>`;
                    labels.push(i); dataPoints.push(currentBalance.toFixed(2));
                }
            }
            document.querySelectorAll('.curSign').forEach(el => el.innerText = symbol);
            document.getElementById('resTotal').innerText = currentBalance.toLocaleString(undefined,{minimumFractionDigits:2});
            document.getElementById('resProfit').innerText = (currentBalance - principal).toLocaleString(undefined,{minimumFractionDigits:2});
            updateChart(labels, dataPoints, symbol);
        }

        function updateChart(labels, data, symbol) {
            const ctx = document.getElementById('mainChart').getContext('2d');
            if(chart) chart.destroy();
            chart = new Chart(ctx, {
                type: 'line',
                data: { labels, datasets: [{ data, borderColor: '#4f46e5', tension: 0.3, fill: true, backgroundColor: 'rgba(79, 70, 229, 0.05)', borderWidth: 3, pointRadius: 2 }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { ticks: { callback: v => symbol + v.toLocaleString() } } } }
            });
        }
    </script>
</body>
</html>
