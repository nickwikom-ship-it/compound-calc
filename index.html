<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compound Interest Calculator & Graph</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; }
        .chart-container { position: relative; height: 300px; width: 100%; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen p-4 md:p-8">

    <div class="max-w-5xl mx-auto bg-white rounded-3xl shadow-xl overflow-hidden">
        <div class="bg-indigo-600 p-6 text-white text-center">
            <h1 class="text-2xl md:text-3xl font-bold">📈 เครื่องคำนวณดอกเบี้ยทบต้น</h1>
            <p class="text-indigo-100 mt-1 text-sm">วางแผนการเงิน เห็นการเติบโตแบบชัดเจน</p>
        </div>

        <div class="p-6 md:p-10">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
                <div class="space-y-2">
                    <label class="font-semibold text-gray-700">💰 เงินต้น (บาท)</label>
                    <input type="number" id="principal" value="10000" class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none transition">
                </div>
                
                <div class="space-y-2">
                    <label class="font-semibold text-gray-700">📈 กำไร (%)</label>
                    <div class="flex">
                        <input type="number" id="rate" value="10" class="w-full p-3 bg-gray-50 border border-gray-200 rounded-l-xl focus:ring-2 focus:ring-indigo-500 outline-none">
                        <select id="ratePeriod" class="p-3 bg-indigo-50 border border-gray-200 rounded-r-xl outline-none text-indigo-700 font-medium">
                            <option value="วัน">ต่อวัน</option>
                            <option value="เดือน">ต่อเดือน</option>
                            <option value="ปี" selected>ต่อปี</option>
                        </select>
                    </div>
                </div>

                <div class="space-y-2">
                    <label class="font-semibold text-gray-700">⏳ ระยะเวลา (<span id="durationLabel">ปี</span>)</label>
                    <div class="flex gap-2">
                        <input type="number" id="duration" value="10" class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none">
                        <button onclick="calculate()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-3 rounded-xl font-bold transition-all shadow-lg active:scale-95">คำนวณ</button>
                    </div>
                </div>
            </div>

            <div id="resultArea" class="hidden">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-10">
                    <div class="bg-indigo-50 p-6 rounded-2xl border border-indigo-100">
                        <p class="text-indigo-600 text-sm font-medium uppercase tracking-wider">เงินรวมสุทธิ</p>
                        <h2 id="totalAmount" class="text-4xl font-bold text-indigo-800 mt-1">0.00</h2>
                    </div>
                    <div class="bg-green-50 p-6 rounded-2xl border border-green-100">
                        <p class="text-green-600 text-sm font-medium uppercase tracking-wider">กำไรที่ได้รับ</p>
                        <h2 id="totalProfit" class="text-4xl font-bold text-green-700 mt-1">0.00</h2>
                    </div>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-2 gap-10">
                    <div>
                        <h3 class="text-lg font-bold text-gray-800 mb-4">📊 กราฟการเติบโต</h3>
                        <div class="chart-container bg-white p-4 border border-gray-100 rounded-2xl shadow-sm">
                            <canvas id="growthChart"></canvas>
                        </div>
                    </div>

                    <div>
                        <h3 class="text-lg font-bold text-gray-800 mb-4">📝 ตารางสรุปราย<span id="tablePeriodText">ปี</span></h3>
                        <div class="overflow-y-auto max-h-[300px] border border-gray-100 rounded-2xl shadow-sm">
                            <table class="w-full text-left">
                                <thead class="sticky top-0 bg-gray-100">
                                    <tr>
                                        <th class="p-3 text-sm font-semibold text-gray-600">รอบที่</th>
                                        <th class="p-3 text-sm font-semibold text-gray-600">เงินต้น</th>
                                        <th class="p-3 text-sm font-semibold text-gray-600">กำไร</th>
                                        <th class="p-3 text-sm font-semibold text-gray-600 text-right">เงินรวม</th>
                                    </tr>
                                </thead>
                                <tbody id="resultTable" class="divide-y divide-gray-50"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let myChart = null;
        const ratePeriod = document.getElementById('ratePeriod');
        const durationLabel = document.getElementById('durationLabel');
        const tablePeriodText = document.getElementById('tablePeriodText');

        ratePeriod.addEventListener('change', () => {
            durationLabel.innerText = ratePeriod.value;
            tablePeriodText.innerText = ratePeriod.value;
        });

        function calculate() {
            const principal = parseFloat(document.getElementById('principal').value);
            const rate = parseFloat(document.getElementById('rate').value) / 100;
            const duration = parseInt(document.getElementById('duration').value);
            const tableBody = document.getElementById('resultTable');
            const resultArea = document.getElementById('resultArea');

            if (isNaN(principal) || isNaN(rate) || isNaN(duration)) return;

            resultArea.classList.remove('hidden');
            tableBody.innerHTML = '';

            let currentBalance = principal;
            let labels = ['เริ่ม'];
            let dataPoints = [principal];

            for (let i = 1; i <= duration; i++) {
                let interest = currentBalance * rate;
                let startBalance = currentBalance;
                currentBalance += interest;

                // Update Table
                const row = `<tr class="hover:bg-indigo-50/50 transition">
                    <td class="p-3 text-sm">${i}</td>
                    <td class="p-3 text-sm text-gray-500">${startBalance.toLocaleString(undefined, {minimumFractionDigits: 2})}</td>
                    <td class="p-3 text-sm text-green-600">+${interest.toLocaleString(undefined, {minimumFractionDigits: 2})}</td>
                    <td class="p-3 text-sm font-bold text-right text-gray-800">${currentBalance.toLocaleString(undefined, {minimumFractionDigits: 2})}</td>
                </tr>`;
                tableBody.innerHTML += row;

                // Update Chart Data
                labels.push(`${ratePeriod.value}ที่ ${i}`);
                dataPoints.push(currentBalance.toFixed(2));
            }

            document.getElementById('totalAmount').innerText = currentBalance.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
            document.getElementById('totalProfit').innerText = (currentBalance - principal).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});

            updateChart(labels, dataPoints);
        }

        function updateChart(labels, data) {
            const ctx = document.getElementById('growthChart').getContext('2d');
            if (myChart) myChart.destroy();

            myChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'เงินรวมทั้งหมด',
                        data: data,
                        borderColor: '#4f46e5',
                        backgroundColor: 'rgba(79, 70, 229, 0.1)',
                        borderWidth: 3,
                        fill: true,
                        tension: 0.4,
                        pointBackgroundColor: '#4f46e5'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { beginAtZero: false, ticks: { callback: value => value.toLocaleString() } }
                    }
                }
            });
        }
    </script>
</body>
</html>
