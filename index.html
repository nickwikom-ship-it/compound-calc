<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Finance & Trading Simulator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>body { font-family: 'Kanit', sans-serif; }</style>
</head>
<body class="bg-slate-50 min-h-screen p-4 md:p-8">
    <div class="max-w-6xl mx-auto bg-white rounded-3xl shadow-2xl overflow-hidden">
        
        <div class="bg-slate-900 p-8 text-white text-center">
            <h1 class="text-3xl font-bold mb-4">🚀 Advanced Multi-Finance Tool</h1>
            <div class="flex justify-center gap-2 bg-slate-800 p-1 rounded-2xl max-w-md mx-auto">
                <button onclick="switchMode('compound')" id="btn-compound" class="flex-1 py-2 px-4 rounded-xl font-semibold transition bg-indigo-600 text-white">
                    ดอกเบี้ยทบต้น
                </button>
                <button onclick="switchMode('trading')" id="btn-trading" class="flex-1 py-2 px-4 rounded-xl font-semibold transition text-slate-400 hover:text-white">
                    จำลองการเทรด
                </button>
            </div>
        </div>

        <div class="p-6 md:p-10">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                <div class="space-y-2">
                    <label class="font-semibold text-gray-700">💰 สกุลเงิน</label>
                    <select id="currency" class="w-full p-4 bg-gray-50 border rounded-2xl outline-none focus:ring-2 focus:ring-indigo-500">
                        <option value="฿">THB (฿)</option>
                        <option value="$">USD ($)</option>
                        <option value="€">EUR (€)</option>
                    </select>
                </div>
                <div class="space-y-2">
                    <label class="font-semibold text-gray-700">💵 เงินต้นเริ่มต้น</label>
                    <input type="number" id="principal" value="10000" class="w-full p-4 bg-gray-50 border rounded-2xl outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
            </div>

            <div id="input-compound" class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-10">
                <div class="space-y-2">
                    <label class="font-semibold text-gray-700">📈 กำไร (%) ต่อรอบ</label>
                    <div class="flex">
                        <input type="number" id="rate" value="5" class="w-full p-4 bg-gray-50 border rounded-l-2xl outline-none">
                        <select id="ratePeriod" class="p-4 bg-indigo-50 border border-l-0 rounded-r-2xl outline-none text-indigo-700 font-bold">
                            <option value="วัน">ต่อวัน</option>
                            <option value="เดือน">ต่อเดือน</option>
                            <option value="ปี" selected>ต่อปี</option>
                        </select>
                    </div>
                </div>
                <div class="space-y-2">
                    <label class="font-semibold text-gray-700">⏳ จำนวนรอบทั้งหมด</label>
                    <input type="number" id="duration" value="12" class="w-full p-4 bg-gray-50 border rounded-2xl outline-none">
                </div>
            </div>

            <div id="input-trading" class="hidden grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
                <div class="space-y-2">
                    <label class="font-semibold text-gray-700">🎯 Win Rate (%)</label>
                    <input type="number" id="winRate" value="60" class="w-full p-4 bg-gray-50 border rounded-2xl outline-none">
                </div>
                <div class="space-y-2">
                    <label class="font-semibold text-gray-700">✅ Take Profit (Points)</label>
                    <input type="number" id="tpPoints" value="500" class="w-full p-4 bg-green-50 border border-green-100 rounded-2xl outline-none">
                </div>
                <div class="space-y-2">
                    <label class="font-semibold text-gray-700">❌ Stop Loss (Points)</label>
                    <input type="number" id="slPoints" value="250" class="w-full p-4 bg-red-50 border border-red-100 rounded-2xl outline-none">
                </div>
                <div class="space-y-2">
                    <label class="font-semibold text-gray-700">⚙️ การคำนวณ Lot</label>
                    <select id="lotType" onchange="toggleLotInput()" class="w-full p-4 bg-indigo-50 border rounded-2xl outline-none font-bold text-indigo-700">
                        <option value="fixed">Fixed Lot (ระบุค่าเอง)</option>
                        <option value="percent">Risk % of Capital (ตามเงินต้น)</option>
                    </select>
                </div>
                <div class="space-y-2">
                    <label id="lotLabel" class="font-semibold text-gray-700">📦 จำนวน Lot</label>
                    <input type="number" id="lotValue" value="0.1" step="0.01" class="w-full p-4 bg-gray-50 border rounded-2xl outline-none">
                </div>
                <div class="space-y-2">
                    <label class="font-semibold text-gray-700">🔄 จำนวนไม้ที่เทรด</label>
                    <input type="number" id="totalTrades" value="20" class="w-full p-4 bg-gray-50 border rounded-2xl outline-none">
                </div>
            </div>

            <button onclick="processCalculation()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-5 rounded-2xl font-bold text-xl shadow-lg transition-all active:scale-95 mb-10">
                คำนวณผลลัพธ์
            </button>

            <div id="results" class="hidden animate-in fade-in">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-10">
                    <div class="bg-indigo-50 p-6 rounded-3xl border border-indigo-100 text-center">
                        <p class="text-indigo-600 text-xs font-bold uppercase mb-1">Balance สุทธิ</p>
                        <h2 class="text-4xl font-bold text-indigo-900"><span class="curSign"></span> <span id="resTotal">0</span></h2>
                    </div>
                    <div class="bg-emerald-50 p-6 rounded-3xl border border-emerald-100 text-center">
                        <p class="text-emerald-600 text-xs font-bold uppercase mb-1">กำไร/ขาดทุนรวม</p>
                        <h2 class="text-4xl font-bold text-emerald-700"><span class="curSign"></span> <span id="resProfit">0</span></h2>
                    </div>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                    <div class="bg-white p-4 border rounded-3xl shadow-sm h-[400px]">
                        <canvas id="mainChart"></canvas>
                    </div>
                    <div class="bg-white border rounded-3xl shadow-sm overflow-hidden flex flex-col">
                        <div id="tableHeaderLabel" class="font-bold text-gray-800 p-4 border-b bg-gray-100">รายละเอียดรายงวด</div>
                        <div class="overflow-y-auto max-h-[320px]">
                            <table class="w-full text-left border-collapse">
                                <thead class="bg-white sticky top-0 shadow-sm text-[10px] font-bold text-gray-400 uppercase">
                                    <tr>
                                        <th class="p-4">ลำดับ</th>
                                        <th class="p-4 text-right">เงินต้นเริ่มต้น</th>
                                        <th id="colStatus" class="p-4 hidden text-center">สถานะ</th>
                                        <th class="p-4 text-right">กำไร/ขาดทุน</th>
                                        <th class="p-4 text-right text-gray-800">เงินรวม</th>
                                    </tr>
                                </thead>
                                <tbody id="resTable" class="divide-y text-sm"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentMode = 'compound';
        let chart = null;

        function switchMode(mode) {
            currentMode = mode;
            document.getElementById('input-compound').classList.toggle('hidden', mode !== 'compound');
            document.getElementById('input-trading').classList.toggle('hidden', mode !== 'trading');
            const bC = document.getElementById('btn-compound');
            const bT = document.getElementById('btn-trading');
            bC.className = mode === 'compound' ? "flex-1 py-2 px-4 rounded-xl font-semibold bg-indigo-600 text-white shadow-md" : "flex-1 py-2 px-4 rounded-xl font-semibold text-slate-400 hover:text-white";
            bT.className = mode === 'trading' ? "flex-1 py-2 px-4 rounded-xl font-semibold bg-indigo-600 text-white shadow-md" : "flex-1 py-2 px-4 rounded-xl font-semibold text-slate-400 hover:text-white";
        }

        function toggleLotInput() {
            const type = document.getElementById('lotType').value;
            const label = document.getElementById('lotLabel');
            const input = document.getElementById('lotValue');
            if (type === 'fixed') {
                label.innerText = "📦 จำนวน Lot";
                input.value = "0.1";
            } else {
                label.innerText = "⚠️ ความเสี่ยงต่อไม้ (%)";
                input.value = "1";
            }
        }

        function processCalculation() {
            const principal = parseFloat(document.getElementById('principal').value);
            const symbol = document.getElementById('currency').value;
            if(!principal) return alert("กรุณาระบุเงินต้น");

            document.getElementById('results').classList.remove('hidden');
            document.querySelectorAll('.curSign').forEach(el => el.innerText = symbol);
            
            let labels = ['เริ่ม'];
            let dataPoints = [principal];
            let currentBalance = principal;
            const tableBody = document.getElementById('resTable');
            tableBody.innerHTML = '';
            
            if (currentMode === 'compound') {
                const rate = parseFloat(document.getElementById('rate').value) / 100;
                const duration = parseInt(document.getElementById('duration').value);
                document.getElementById('colStatus').classList.add('hidden');

                for(let i=1; i<=duration; i++) {
                    let startBalance = currentBalance;
                    let interest = currentBalance * rate;
                    currentBalance += interest;
                    tableBody.innerHTML += `<tr>
                        <td class="p-4 text-gray-400">${i}</td>
                        <td class="p-4 text-right">${startBalance.toLocaleString(undefined,{minimumFractionDigits:2})}</td>
                        <td class="p-4 text-right text-emerald-600 font-bold">+${interest.toLocaleString(undefined,{minimumFractionDigits:2})}</td>
                        <td class="p-4 text-right font-bold text-gray-800">${currentBalance.toLocaleString(undefined,{minimumFractionDigits:2})}</td>
                    </tr>`;
                    labels.push('รอบ ' + i);
                    dataPoints.push(currentBalance.toFixed(2));
                }
            } else {
                const winRate = parseFloat(document.getElementById('winRate').value) / 100;
                const tp = parseFloat(document.getElementById('tpPoints').value);
                const sl = parseFloat(document.getElementById('slPoints').value);
                const lotType = document.getElementById('lotType').value;
                const lotVal = parseFloat(document.getElementById('lotValue').value);
                const trades = parseInt(document.getElementById('totalTrades').value);
                document.getElementById('colStatus').classList.remove('hidden');

                for(let i=1; i<=trades; i++) {
                    let startBalance = currentBalance;
                    let calculatedLot = (lotType === 'fixed') ? lotVal : (currentBalance * (lotVal/100)) / sl;
                    
                    const win = Math.random() < winRate;
                    const change = win ? (tp * calculatedLot) : -(sl * calculatedLot);
                    currentBalance += change;

                    tableBody.innerHTML += `<tr>
                        <td class="p-4 text-gray-400">${i}</td>
                        <td class="p-4 text-right">${startBalance.toLocaleString(undefined,{minimumFractionDigits:2})}</td>
                        <td class="p-4 text-center"><span class="px-2 py-1 rounded-lg text-[10px] font-bold ${win?'text-green-600 bg-green-50':'text-red-600 bg-red-50'}">${win?'WIN':'LOSS'}</span></td>
                        <td class="p-4 text-right font-bold ${change>0?'text-green-600':'text-red-600'}">${change.toLocaleString(undefined,{minimumFractionDigits:2})}</td>
                        <td class="p-4 text-right font-bold">${currentBalance.toLocaleString(undefined,{minimumFractionDigits:2})}</td>
                    </tr>`;
                    labels.push('ไม้ ' + i);
                    dataPoints.push(currentBalance.toFixed(2));
                }
            }

            document.getElementById('resTotal').innerText = currentBalance.toLocaleString(undefined,{minimumFractionDigits:2});
            document.getElementById('resProfit').innerText = (currentBalance - principal).toLocaleString(undefined,{minimumFractionDigits:2});
            updateChart(labels, dataPoints, symbol);
        }

        function updateChart(labels, data, symbol) {
            const ctx = document.getElementById('mainChart').getContext('2d');
            if(chart) chart.destroy();
            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Portfolio Value',
                        data: data,
                        borderColor: '#4f46e5',
                        backgroundColor: 'rgba(79, 70, 229, 0.1)',
                        fill: true,
                        tension: 0.3,
                        pointRadius: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: { y: { ticks: { callback: v => symbol + v.toLocaleString() } } }
                }
            });
        }
    </script>
</body>
</html>
